name: Portable Blender runtime transfer cleanup
on:
  push:
    branches: [cloud-blender-env]
    paths: ['.github/workflows/blender-portable-runtime.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Delete this task's transferred runtime artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE repos/habu0502/tiktok-script-eval/actions/artifacts/10136576691
