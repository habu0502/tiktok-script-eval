name: Portable Blender transfer cleanup
on:
  push:
    branches: [cloud-blender-env]
    paths: ['.github/workflows/blender-portable-runtime.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Remove only this task's retrieved temporary runtime parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 10137505194 10137506091 10137507021 10137508168 10137509039 10137509939 10137510843 10137511710; do
            gh api --method DELETE "repos/habu0502/tiktok-script-eval/actions/artifacts/$id"
          done
