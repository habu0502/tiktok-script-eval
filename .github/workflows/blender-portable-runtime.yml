name: Blender transfer cleanup
on:
  push:
    branches: [cloud-blender-env]
    paths: ['.github/workflows/blender-portable-runtime.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Remove only the eight successfully retrieved runtime chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 10138888593 10138889542 10138890431 10138891380 10138892338 10138893193 10138894163 10138895132; do
            gh api --method DELETE "repos/habu0502/tiktok-script-eval/actions/artifacts/$id"
          done
