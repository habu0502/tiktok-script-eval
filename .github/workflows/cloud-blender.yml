name: Cloud Blender 5.2.1

on:
  push:
    branches: [cloud-blender-env]
    paths:
      - '.github/workflows/cloud-blender.yml'
      - 'cloud_blender/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  koharu-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install headless graphics runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgbm1
      - name: Download Blender 5.2.1 LTS
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 'https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -1
      - name: Build Koharu prototype
        env:
          BLENDER_OUT: /tmp/blender-out
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_OUT"
          /tmp/blender/blender --background --factory-startup --python cloud_blender/koharu_build.py
          test -s "$BLENDER_OUT/koharu_prototype.blend"
          test -s "$BLENDER_OUT/koharu_prototype.glb"
          test -s "$BLENDER_OUT/koharu_front.png"
          test -s "$BLENDER_OUT/koharu_side.png"
          test -s "$BLENDER_OUT/koharu_back.png"
          test -s "$BLENDER_OUT/koharu_validation.json"
          cat "$BLENDER_OUT/koharu_validation.json"
      - name: Upload Koharu build
        uses: actions/upload-artifact@v4
        with:
          name: koharu-automated-prototype
          path: /tmp/blender-out/
          retention-days: 1
          if-no-files-found: error
